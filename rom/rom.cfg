MEMORY {
    RAM: start = $0000, size = $8000, file = "";
    ROM: start = $e000, size = $2000,
         file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = RAM, type = zp, start = $00;
    CODE:    load = ROM, type = ro, start = $e000;
    RODATA:  load = ROM, type = ro;
    COP_VEC: load = ROM, type = ro, start = $FFF4;
    BRK_VEC: load = ROM, type = ro, start = $FFF6;
    ABORT_VEC: load = ROM, type = ro, start = $FFF8;
    NMIB_VEC: load = ROM, type = ro, start = $FFFA;
    RESET_VEC: load = ROM, type = ro, start = $FFFC;
    IRQB_VEC: load = ROM, type = ro, start = $FFFE;

}
